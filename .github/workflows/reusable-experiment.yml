name: Reusable Experiment Workflow

on:
  workflow_call:
    inputs:
      python-version:
        required: false
        type: string
        default: "3.11"
      run-command:
        required: true
        type: string
        description: "The command to run the ML pipeline (e.g., 'python src/bifurcated_pipeline.py')"

jobs:
  run-and-sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ inputs.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ inputs.python-version }}

      - name: Install orchestrator_core
        run: |
          python -m pip install --upgrade pip
          # In a real downstream repo, they might have this in their requirements.txt
          # but we can enforce it here if needed or let them install their own deps.
          # Here we just assume they install their deps which should include orchestrator_core.
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f pyproject.toml ]; then pip install -e .; fi

      - name: Run ML Pipeline
        run: ${{ inputs.run-command }}

      - name: Sync Experiment to Ledger
        run: orchestrator-sync
        env:
          LEDGER_DB_URL: ${{ secrets.LEDGER_DB_URL }}
          GSHEETS_TOKEN: ${{ secrets.GSHEETS_TOKEN }}
