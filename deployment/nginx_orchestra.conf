server {
    listen 80;
    server_name api.mrsaz7.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.mrsaz7.com;

    # Cloudflare Origin SSL certificates mapping
    ssl_certificate /etc/ssl/certs/cloudflare_origin.pem;
    ssl_certificate_key /etc/ssl/private/cloudflare_origin.key;

    # Cloudflare authenticated origin pulls (optional but recommended)
    # ssl_client_certificate /etc/ssl/certs/cloudflare-origin-pull-ca.pem;
    # ssl_verify_client on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options SAMEORIGIN;
    add_header X-Content-Type-Options nosniff;

    location / {
        # Route directly to our local port 8000 (FastAPI gateway)
        proxy_pass http://127.0.0.1:8000;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Cloudflare connecting IP header
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        # WebSocket support (if needed for FastAPI in the future)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
